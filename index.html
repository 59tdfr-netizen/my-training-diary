<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a5c">
<title>Мой тренировочный дневник</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #F4F6F8; --card: #FFFFFF; --text: #263445; --muted: #687586;
  --primary: #2878C8; --primary-hover: #1f68b5; --primary-light: #e8f1fb;
  --success: #27845A; --success-light: #e6f4ed; --warn: #b45309;
  --warn-light: #fef7e6; --danger: #c53030; --danger-hover: #a82222;
  --danger-light: #fdeaea; --border: #E1E6EC; --border-strong: #c9d2dc;
  --radius: 10px; --radius-sm: 6px; --radius-lg: 12px;
  --shadow: 0 1px 2px rgba(38, 52, 69, 0.04);
  --shadow-md: 0 4px 12px rgba(38, 52, 69, 0.08);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; line-height: 1.55; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3 { margin: 0; color: var(--text); font-weight: 600; }
h1 { font-size: 20px; line-height: 1.25; } h2 { font-size: 20px; line-height: 1.3; } h3 { font-size: 16px; line-height: 1.35; }
a { color: var(--primary); text-decoration: underline; } a:hover { color: var(--primary-hover); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { flex: 0 1 auto; min-width: 0; }
.brand h1 { font-size: 18px; color: var(--text); margin: 0; }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
.topnav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; -ms-overflow-style: none; padding: 2px 0; max-width: 100%; }
.topnav::-webkit-scrollbar { display: none; }
.nav-btn { flex: 0 0 auto; border: none; background: transparent; color: var(--muted); padding: 8px 14px; font-size: 14px; font-weight: 500; font-family: inherit; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; min-height: 36px; transition: background .15s, color .15s; }
.nav-btn:hover { background: var(--bg); color: var(--text); }
.nav-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
@media (max-width: 720px) { .topbar-inner { padding: 10px 16px; gap: 10px; } .brand { width: 100%; } .brand-sub { max-width: 100%; } .topnav { margin-left: 0; width: 100%; } .brand h1 { font-size: 17px; } }
main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; }
@media (max-width: 720px) { main { padding: 16px 12px 32px; } }
.section { margin-bottom: 24px; }
.section-title { font-size: 18px; font-weight: 600; color: var(--text); margin: 0 0 12px; }
.section-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-header-row .section-title { margin: 0; }
.section-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border); background: var(--card); }
.banner-info { background: var(--primary-light); border-color: #c5dcf5; }
.banner-warn { background: var(--warn-light); border-color: #f4d9b0; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .stats { gap: 8px; } }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.15; word-break: break-word; }
.stat-sub { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
@media (max-width: 420px) { .stat-value { font-size: 19px; } .stat { padding: 12px; } }
.rules-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); }
.rules-list, .goals-list, .notes-list { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.55; }
.rules-list li, .goals-list li, .notes-list li { margin-bottom: 6px; }
.rules-list li:last-child, .goals-list li:last-child, .notes-list li:last-child { margin-bottom: 0; }
.rules-list li::marker { color: var(--primary); } .goals-list li::marker { color: var(--success); } .notes-list li::marker { color: var(--warn); }
.day-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 720px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .day-grid { grid-template-columns: repeat(3, 1fr); } }
.day-card { background: var(--card); border: 1px solid var(--border); border-top-width: 3px; border-top-color: var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.day-card-green { border-top-color: var(--success); } .day-card-blue { border-top-color: var(--primary); } .day-card-purple { border-top-color: #6d5aa5; }
.day-card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.day-card-heading { min-width: 0; flex: 1; }
.day-card-title { font-weight: 600; font-size: 16px; color: var(--text); line-height: 1.3; }
.day-card-focus { font-size: 13px; color: var(--muted); margin-top: 2px; }
.status-badge { flex: 0 0 auto; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.02em; }
.status-not-started { background: #eef1f4; color: var(--muted); } .status-in-progress { background: var(--warn-light); color: var(--warn); } .status-done { background: var(--success-light); color: var(--success); }
.ex-list { list-style: none; margin: 0; padding: 0; flex: 1; }
.ex-item { padding: 12px 16px; border-bottom: 1px solid var(--border); } .ex-item:last-child { border-bottom: none; }
.ex-name { font-weight: 600; font-size: 15px; color: var(--text); line-height: 1.35; }
.ex-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.ex-meta .badge { display: inline-block; background: var(--bg); color: var(--text); font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.ex-note { margin-top: 4px; font-size: 12px; color: var(--muted); }
.ex-link { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; font-weight: 500; padding: 0; font-family: inherit; text-decoration: none; }
.ex-link:hover { text-decoration: underline; }
.day-card-actions { padding: 12px 16px; border-top: 1px solid var(--border); background: #fafbfc; display: flex; gap: 8px; flex-wrap: wrap; }
.day-card-actions .btn { flex: 1; min-width: 0; }
.extra-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 600px) { .extra-grid { grid-template-columns: 1fr 1fr; } }
.extra-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.extra-title { font-weight: 600; font-size: 14px; color: var(--text); margin-bottom: 4px; }
.extra-text { font-size: 13px; color: var(--muted); line-height: 1.5; }
.storage-note { padding: 12px 16px; background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); font-size: 13px; }
.workout-header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 20px; padding: 16px 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.workout-header .section-title { margin-bottom: 4px; }
.workout-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.exercise-list { display: flex; flex-direction: column; gap: 12px; }
.exercise-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); }
.exercise-header { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;}
.exercise-title-wrap { flex: 1; min-width: 200px; }
.exercise-name { font-weight: 600; font-size: 16px; color: var(--text); line-height: 1.35; }
.exercise-plan { font-size: 13px; color: var(--muted); margin-top: 2px; }
.exercise-note { font-size: 12px; color: var(--muted); margin-top: 2px; font-style: italic; }
.pr-badge { display: inline-block; background: #fff3cd; color: #856404; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid #ffeeba; margin-left: 8px; vertical-align: middle; }
.exercise-controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
.check input:disabled { cursor: not-allowed; }
.exercise-weight { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.weight-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.weight-input-wrap { display: inline-flex; align-items: center; gap: 6px; }
.sets { display: flex; flex-direction: column; gap: 4px; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
.set-row:first-child { border-top: none; }
.set-label { min-width: 76px; font-size: 13px; font-weight: 600; color: var(--muted); }
.set-inputs { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex: 1; }
.set-input-group { display: inline-flex; align-items: center; gap: 4px; }
.unit { font-size: 13px; color: var(--muted); }
.exercise-comment { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.exercise-comment .input { font-size: 14px; }
.btn-timer { background: #f0f4f9; border: 1px solid #c9d2dc; color: #263445; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;}
.btn-timer.running { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.input { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0 12px; font-size: 15px; font-family: inherit; background: var(--card); color: var(--text); min-height: 38px; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
.input::placeholder { color: #a0abb8; opacity: 1; }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(40, 120, 200, 0.12); }
.input-sm { max-width: 88px; padding: 0 10px; min-height: 36px; font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }
.field-inline { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0 14px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; background: var(--card); color: var(--text); min-height: 38px; line-height: 1; text-decoration: none; transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-ghost { background: var(--card); border-color: var(--border-strong); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--bg); border-color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); border-color: var(--danger-hover); }
.btn-block { width: 100%; } .btn-sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
@media (max-width: 600px) { .btn { min-height: 42px; font-size: 14px; } .btn-sm { min-height: 34px; } .input { min-height: 42px; font-size: 16px; } .input-sm { min-height: 38px; } }
.empty-state { background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 36px 20px; text-align: center; }
.empty-title { font-weight: 600; font-size: 16px; color: var(--text); margin-bottom: 6px; }
.empty-text { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.filters .input { flex: 1; min-width: 140px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); align-items: center; }
.history-item-main { flex: 1; min-width: 200px; cursor: pointer; }
.history-date { font-weight: 600; font-size: 15px; color: var(--text); }
.history-date .muted { font-weight: 400; font-size: 13px; margin-left: 4px; }
.history-day { font-size: 14px; color: var(--text); margin: 2px 0; }
.history-item-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.history-detail { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.history-ex { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.history-ex-name { font-weight: 600; font-size: 15px; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sets-table { display: flex; flex-direction: column; gap: 4px; }
.set-line { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--text); padding: 3px 0; }
.set-line .muted { color: var(--muted); }
.chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; overflow-x: auto; box-shadow: var(--shadow); }
.chart-svg { display: block; max-width: 100%; height: auto; }
.edit-program { display: flex; flex-direction: column; gap: 16px; }
.edit-day { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.edit-day-header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.edit-day-header .input { flex: 1; min-width: 140px; }
.edit-section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.edit-ex { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border); }
.edit-ex:first-of-type { border-top: none; }
@media (min-width: 800px) { .edit-ex { grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr auto; align-items: center; } .edit-ex-note { grid-column: 1 / -1; } }
.edit-ex-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.edit-add { background: none; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 8px 14px; color: var(--primary); font-weight: 500; font-size: 14px; font-family: inherit; cursor: pointer; margin-top: 8px; transition: background .15s, border-color .15s; }
.edit-add:hover { background: var(--primary-light); border-color: var(--primary); }
.edit-banner { background: var(--warn-light); border: 1px solid #f4d9b0; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
.image-ref { margin: 16px 0; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.image-ref summary { cursor: pointer; color: var(--primary); font-weight: 500; font-size: 14px; margin-bottom: 8px; }
.image-ref img { max-width: 100%; max-height: 400px; border-radius: var(--radius-sm); border: 1px solid var(--border); display: block; margin-top: 8px; }
.upload-box { background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 24px; text-align: center; }
.upload-box p { margin: 0 0 12px; font-size: 14px; }
.upload-preview { margin: 16px 0; text-align: center; }
.upload-preview img { max-width: 100%; max-height: 360px; border-radius: var(--radius); border: 1px solid var(--border); }
.backup-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 720px) { .backup-grid { grid-template-columns: 1fr 1fr; } }
.backup-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.backup-card h3 { margin: 0 0 8px; font-size: 16px; } .backup-card p { font-size: 13px; margin: 0 0 12px; }
.import-preview { background: var(--primary-light); border-radius: var(--radius-sm); padding: 12px 14px; margin: 12px 0; font-size: 13px; line-height: 1.5; }
.import-preview div { margin-bottom: 2px; }
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(38, 52, 69, 0.45); }
.modal-content { position: relative; background: var(--card); border-radius: var(--radius-lg); padding: 24px; max-width: 520px; width: 100%; box-shadow: var(--shadow-md), 0 20px 60px rgba(38, 52, 69, 0.2); max-height: 90vh; overflow-y: auto; }
.modal-content h3 { margin: 0 0 8px; font-size: 18px; }
.modal-content p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.summary { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; max-height: 300px; overflow-y: auto; }
.summary-ex { padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); font-size: 13px; }
.summary-ex.skipped { background: var(--danger-light); }
.summary-name { font-weight: 600; margin-bottom: 4px; font-size: 14px; color: var(--text); }
.summary-set { display: inline-block; margin-right: 8px; color: var(--text); font-size: 13px; }
.tag { display: inline-block; background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
.warn { color: var(--warn); font-size: 13px; margin: 8px 0; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: var(--radius-sm); z-index: 200; box-shadow: var(--shadow-md); font-size: 14px; max-width: calc(100vw - 40px); text-align: center; }
.toast[hidden] { display: none; } .toast-error { background: var(--danger); } .toast-success { background: var(--success); }

/* Стили для Heatmap (Календарь активности) */
.heatmap-container { overflow-x: auto; padding-bottom: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.heatmap-grid { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 3px; width: max-content; }
.heatmap-cell { width: 12px; height: 12px; border-radius: 2px; background: #ebedf0; }
.heatmap-cell[data-level="1"] { background: #9be9a8; }
.heatmap-cell[data-level="2"] { background: #40c463; }
.heatmap-cell[data-level="3"] { background: #30a14e; }
.heatmap-legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--muted); }

/* Адаптивность для мобильных телефонов (календарь уменьшается) */
@media (max-width: 768px) {
  .heatmap-grid { grid-template-rows: repeat(7, 8px); gap: 2px; }
  .heatmap-cell { width: 8px; height: 8px; }
  .heatmap-legend { margin-top: 6px; }
}

/* ===== Тело, вес и ИМТ ===== */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.form-grid .field { margin-bottom: 0; }
.bmi-scale-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.bmi-scale { position: relative; padding-top: 12px; }
.bmi-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #ebedf0; }
.bmi-bar span { display: block; height: 100%; }
.bmi-marker { position: absolute; top: 2px; width: 3px; height: 22px; border-radius: 2px; background: #263445; box-shadow: 0 0 0 2px var(--card); transform: translateX(-50%); }
.bmi-axis { position: relative; height: 18px; margin-top: 6px; }
.bmi-axis span { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
.profile-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 20px; box-shadow: var(--shadow); }

.tone-up { background: var(--success-light); color: var(--success); }
